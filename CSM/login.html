<form action="loginpage" method="post">

        <label>Account Number</label>
        <input type="number"
               name="accountno"
               placeholder="Enter Account Number"
               required>

        <label>Account Name</label>
        <input type="text"
               name="accountname"
               placeholder="Enter Account Name"
               required>

        <input type="submit" value="Login">

    </form>
