 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureBank - Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            overflow: hidden;
            background:
                radial-gradient(circle at 20% 20%, #25104d 0%, transparent 35%),
                radial-gradient(circle at 80% 80%, #062f4f 0%, transparent 35%),
                linear-gradient(135deg, #02020d, #05051b 50%, #01030d);
            color: white;
            position: relative;
        }

        /* =========================================
           FULL SCREEN DISCO BUBBLES
           ========================================= */

        #disco-bg {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: none;
            z-index: 1;
        }

        .bubble {
            position: absolute;
            border-radius: 50%;
            opacity: 0.75;

            background:
                radial-gradient(
                    circle at 30% 30%,
                    rgba(255,255,255,0.95),
                    rgba(255,255,255,0.25) 12%,
                    var(--bubble-color) 45%,
                    transparent 75%
                );

            box-shadow:
                0 0 10px var(--bubble-color),
                0 0 25px var(--bubble-color),
                0 0 50px var(--bubble-color);

            animation:
                bubbleFloat var(--duration) linear infinite,
                bubblePulse 2.5s ease-in-out infinite;
        }

        @keyframes bubbleFloat {
            0% {
                transform: translateY(110vh) translateX(0) scale(0.4);
                opacity: 0;
            }

            10% {
                opacity: 0.8;
            }

            50% {
                transform:
                    translateY(50vh)
                    translateX(var(--move))
                    scale(1);
            }

            90% {
                opacity: 0.8;
            }

            100% {
                transform:
                    translateY(-20vh)
                    translateX(calc(var(--move) * -1))
                    scale(0.6);
                opacity: 0;
            }
        }

        @keyframes bubblePulse {
            0%,
            100% {
                filter: brightness(0.8);
            }

            50% {
                filter: brightness(1.5);
            }
        }

        /* =========================================
           LASER LIGHT EFFECT
           ========================================= */

        .laser {
            position: fixed;
            width: 120%;
            height: 3px;
            left: -10%;
            z-index: 2;
            pointer-events: none;

            background: linear-gradient(
                90deg,
                transparent,
                #ff00ff,
                #00ffff,
                #ffffff,
                #ff00ff,
                transparent
            );

            box-shadow:
                0 0 5px #ffffff,
                0 0 15px #ff00ff,
                0 0 30px #00ffff,
                0 0 60px #ff00ff;
        }

        .laser1 {
            top: 20%;
            transform: rotate(12deg);
            animation: laserMove1 5s ease-in-out infinite alternate;
        }

        .laser2 {
            top: 45%;
            transform: rotate(-15deg);
            animation: laserMove2 6s ease-in-out infinite alternate;
        }

        .laser3 {
            top: 70%;
            transform: rotate(8deg);
            animation: laserMove3 7s ease-in-out infinite alternate;
        }

        .laser4 {
            top: 85%;
            transform: rotate(-10deg);
            animation: laserMove4 5.5s ease-in-out infinite alternate;
        }

        @keyframes laserMove1 {
            from {
                transform: translateX(-20%) rotate(12deg);
            }

            to {
                transform: translateX(20%) rotate(12deg);
            }
        }

        @keyframes laserMove2 {
            from {
                transform: translateX(20%) rotate(-15deg);
            }

            to {
                transform: translateX(-20%) rotate(-15deg);
            }
        }

        @keyframes laserMove3 {
            from {
                transform: translateX(-15%) rotate(8deg);
            }

            to {
                transform: translateX(15%) rotate(8deg);
            }
        }

        @keyframes laserMove4 {
            from {
                transform: translateX(15%) rotate(-10deg);
            }

            to {
                transform: translateX(-15%) rotate(-10deg);
            }
        }

        /* =========================================
           EXTRA NEON GLOW
           ========================================= */

        .glow {
            position: fixed;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            filter: blur(100px);
            opacity: 0.3;
        }

        .glow1 {
            top: -150px;
            left: -100px;
            background: #ff00ff;
        }

        .glow2 {
            right: -150px;
            bottom: -150px;
            background: #00ffff;
        }

        .glow3 {
            top: 40%;
            left: 40%;
            background: #7a00ff;
        }

        /* =========================================
           MAIN LOGIN AREA
           ========================================= */

        .page {
            position: relative;
            z-index: 10;

            width: 100%;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 30px;
        }

        .login-wrapper {
            width: 100%;
            max-width: 1000px;
            min-height: 600px;

            display: grid;
            grid-template-columns: 1fr 1fr;

            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 30px;

            background: rgba(5, 5, 25, 0.72);

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            box-shadow:
                0 0 20px rgba(0,255,255,0.2),
                0 0 50px rgba(255,0,255,0.15),
                inset 0 0 30px rgba(255,255,255,0.03);

            overflow: hidden;
        }

        /* =========================================
           LEFT SECTION
           ========================================= */

        .left-section {
            position: relative;

            display: flex;
            flex-direction: column;
            justify-content: center;

            padding: 60px;

            background:
                linear-gradient(
                    135deg,
                    rgba(255,0,255,0.12),
                    rgba(0,255,255,0.08)
                );

            border-right: 1px solid rgba(255,255,255,0.12);
        }

        .logo {
            font-size: 48px;
            font-weight: 800;

            background: linear-gradient(
                90deg,
                #00ffff,
                #ff00ff,
                #7a00ff
            );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

            margin-bottom: 20px;
        }

        .tagline {
            font-size: 18px;
            line-height: 1.7;
            color: rgba(255,255,255,0.75);
            max-width: 400px;
        }

        .neon-line {
            width: 120px;
            height: 4px;
            margin: 25px 0;

            border-radius: 10px;

            background: linear-gradient(
                90deg,
                #00ffff,
                #ff00ff
            );

            box-shadow:
                0 0 10px #00ffff,
                0 0 20px #ff00ff;
        }

        .features {
            margin-top: 30px;
        }

        .feature {
            display: flex;
            align-items: center;

            gap: 12px;

            margin-bottom: 18px;

            color: rgba(255,255,255,0.8);
        }

        .feature-icon {
            width: 35px;
            height: 35px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: rgba(0,255,255,0.1);

            border: 1px solid rgba(0,255,255,0.4);

            box-shadow:
                0 0 10px rgba(0,255,255,0.3);
        }

        /* =========================================
           RIGHT LOGIN SECTION
           ========================================= */

        .right-section {
            display: flex;
            align-items: center;
            justify-content: center;

            padding: 50px;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
        }

        .login-title {
            font-size: 36px;
            margin-bottom: 10px;

            background: linear-gradient(
                90deg,
                #ffffff,
                #00ffff
            );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .login-subtitle {
            color: rgba(255,255,255,0.55);
            margin-bottom: 35px;
        }

        /* =========================================
           FORM
           ========================================= */

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;

            margin-bottom: 9px;

            font-size: 14px;

            color: rgba(255,255,255,0.8);
        }

        .form-group input {
            width: 100%;

            padding: 16px 18px;

            border-radius: 12px;

            border: 1px solid rgba(255,255,255,0.15);

            outline: none;

            background: rgba(255,255,255,0.05);

            color: white;

            font-size: 16px;

            transition: 0.3s;
        }

        .form-group input::placeholder {
            color: rgba(255,255,255,0.35);
        }

        .form-group input:focus {
            border-color: #00ffff;

            background: rgba(0,255,255,0.06);

            box-shadow:
                0 0 10px rgba(0,255,255,0.3),
                0 0 25px rgba(0,255,255,0.15);
        }

        /* =========================================
           LOGIN BUTTON
           ========================================= */

        .login-btn {
            width: 100%;

            padding: 16px;

            border: none;
            border-radius: 12px;

            cursor: pointer;

            font-size: 17px;
            font-weight: bold;

            color: white;

            background:
                linear-gradient(
                    90deg,
                    #7a00ff,
                    #ff00aa,
                    #00c8ff
                );

            background-size: 200% 100%;

            box-shadow:
                0 0 15px rgba(255,0,255,0.4),
                0 0 30px rgba(0,255,255,0.15);

            transition: 0.4s;

            animation: buttonGradient 4s linear infinite;
        }

        .login-btn:hover {
            transform: translateY(-2px) scale(1.01);

            box-shadow:
                0 0 20px rgba(255,0,255,0.7),
                0 0 40px rgba(0,255,255,0.4);
        }

        @keyframes buttonGradient {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        /* =========================================
           REGISTER LINK
           ========================================= */

        .register-text {
            text-align: center;

            margin-top: 25px;

            color: rgba(255,255,255,0.55);

            font-size: 14px;
        }

        .register-text a {
            color: #00ffff;

            text-decoration: none;

            font-weight: bold;

            transition: 0.3s;
        }

        .register-text a:hover {
            color: #ff00ff;

            text-shadow:
                0 0 10px #ff00ff;
        }

        /* =========================================
           SECURITY TEXT
           ========================================= */

        .security {
            display: flex;
            align-items: center;
            justify-content: center;

            gap: 7px;

            margin-top: 30px;

            font-size: 12px;

            color: rgba(255,255,255,0.35);
        }

        .security span {
            color: #00ff99;

            text-shadow:
                0 0 8px #00ff99;
        }

        /* =========================================
           RESPONSIVE
           ========================================= */

        @media (max-width: 850px) {

            body {
                overflow-y: auto;
            }

            .page {
                padding: 20px;
            }

            .login-wrapper {
                grid-template-columns: 1fr;
                max-width: 500px;
            }

            .left-section {
                padding: 40px;
                min-height: 350px;

                border-right: none;

                border-bottom: 1px solid rgba(255,255,255,0.12);
            }

            .right-section {
                padding: 40px;
            }

            .logo {
                font-size: 38px;
            }
        }

        @media (max-width: 500px) {

            .page {
                padding: 10px;
            }

            .login-wrapper {
                border-radius: 20px;
            }

            .left-section,
            .right-section {
                padding: 30px 20px;
            }

            .logo {
                font-size: 32px;
            }

            .login-title {
                font-size: 30px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================================
         DISCO BUBBLES
         ========================================= -->

    <div id="disco-bg"></div>

    <!-- =========================================
         LASERS
         ========================================= -->

    <div class="laser laser1"></div>
    <div class="laser laser2"></div>
    <div class="laser laser3"></div>
    <div class="laser laser4"></div>

    <!-- =========================================
         NEON GLOW
         ========================================= -->

    <div class="glow glow1"></div>
    <div class="glow glow2"></div>
    <div class="glow glow3"></div>

    <!-- =========================================
         MAIN PAGE
         ========================================= -->

    <main class="page">

        <div class="login-wrapper">

            <!-- LEFT SIDE -->

            <section class="left-section">

                <div class="logo">
                    SecureBank
                </div>

                <div class="neon-line"></div>

                <p class="tagline">
                    Welcome to your secure digital banking
                    experience. Manage your account safely,
                    quickly, and securely.
                </p>

                <div class="features">

                    <div class="feature">
                        <div class="feature-icon">
                            ✓
                        </div>

                        <span>
                            Secure Account Access
                        </span>
                    </div>

                    <div class="feature">
                        <div class="feature-icon">
                            ⚡
                        </div>

                        <span>
                            Fast & Reliable Banking
                        </span>
                    </div>

                    <div class="feature">
                        <div class="feature-icon">
                            🔒
                        </div>

                        <span>
                            Protected Login
                        </span>
                    </div>

                </div>

            </section>


            <!-- RIGHT SIDE -->

            <section class="right-section">

                <div class="login-container">

                    <h1 class="login-title">
                        Welcome Back
                    </h1>

                    <p class="login-subtitle">
                        Sign in to access your account
                    </p>


                    <!-- LOGIN FORM -->

                    <form action="loginpage" method="post">

                        <div class="form-group">

                            <label for="accountno">
                                Account Number
                            </label>

                            <input
                                type="text"
                                id="accountno"
                                name="accountno"
                                placeholder="Enter your account number"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label for="accountname">
                                Account Name
                            </label>

                            <input
                                type="text"
                                id="accountname"
                                name="accountname"
                                placeholder="Enter your account name"
                                required
                            >

                        </div>


                        <button
                            type="submit"
                            class="login-btn"
                        >
                            Sign In
                        </button>

                    </form>


                    <!-- REGISTER -->

                    <div class="register-text">

                        Don't have an account?

                        <a href="register.html">
                            Create Account
                        </a>

                    </div>


                    <!-- SECURITY -->

                    <div class="security">

                        <span>●</span>

                        Your connection is secure

                    </div>

                </div>

            </section>

        </div>

    </main>


    <!-- =========================================
         BUBBLE JAVASCRIPT
         ========================================= -->

    <script>

        const discoBg = document.getElementById("disco-bg");

        const colors = [
            "#ff00ff",
            "#00ffff",
            "#7a00ff",
            "#ff0080",
            "#00ff99",
            "#008cff",
            "#ff3300",
            "#ffff00"
        ];

        const bubbleCount = 70;

        for (let i = 0; i < bubbleCount; i++) {

            const bubble = document.createElement("span");

            bubble.classList.add("bubble");

            const size =
                Math.floor(Math.random() * 70) + 20;

            const left =
                Math.random() * 100;

            const duration =
                Math.floor(Math.random() * 12) + 8;

            const delay =
                Math.random() * -20;

            const move =
                Math.floor(Math.random() * 300) - 150;

            const color =
                colors[
                    Math.floor(
                        Math.random() * colors.length
                    )
                ];

            bubble.style.width = size + "px";
            bubble.style.height = size + "px";

            bubble.style.left = left + "%";

            bubble.style.setProperty(
                "--duration",
                duration + "s"
            );

            bubble.style.setProperty(
                "--move",
                move + "px"
            );

            bubble.style.setProperty(
                "--bubble-color",
                color
            );

            bubble.style.animationDelay =
                delay + "s";

            discoBg.appendChild(bubble);
        }

    </script>

</body>
</html>
